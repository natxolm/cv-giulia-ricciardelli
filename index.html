<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Giulia Ricciardelli – Curriculum Vitae</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1f2a37; --muted: #5b6675; --accent: #0f5c63; --accent-soft: #e6f0f1; --rule: #d9dee4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", Arial, sans-serif; color: var(--ink); background: #f4f6f8;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
          padding: 36px 32px; max-width: 460px; width: 100%; text-align: center; }
  img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #fff;
        box-shadow: 0 0 0 2px var(--accent); }
  h1 { font-size: 26px; margin-top: 18px; }
  h1 span { color: var(--accent); }
  .role { color: var(--accent); font-weight: 600; margin-top: 4px; }
  p.hint { color: var(--muted); font-size: 14px; margin: 22px 0 14px; }
  a.btn { display: block; text-decoration: none; background: var(--accent-soft); color: var(--accent);
          font-weight: 600; padding: 14px 16px; border-radius: 10px; margin-top: 10px; }
  a.btn:hover { background: var(--accent); color: #fff; }
  a.btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  a.btn:hover small { color: #e6f0f1; }
</style>
</head>
<body>
  <main class="card">
    <img src="foto-giulia.jpg" alt="Foto di Giulia Ricciardelli">
    <h1>Giulia <span>Ricciardelli</span></h1>
    <div class="role">Responsabile Partnership &amp; Sponsorship</div>
    <p class="hint">Scegli la versione del curriculum:</p>
    <a class="btn" href="cv-sidebar.html">Versione con colonna laterale<small>Layout a due colonne</small></a>
    <a class="btn" href="cv-una-colonna.html">Versione a colonna unica<small>Più leggibile dai sistemi di selezione automatica (ATS)</small></a>
  </main>
</body>
</html>
